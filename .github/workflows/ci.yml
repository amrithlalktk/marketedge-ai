name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: marketedge, POSTGRES_PASSWORD: marketedge, POSTGRES_DB: marketedge}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U marketedge" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt bandit pip-audit
      - name: lint
        run: ruff check app engine tests
      - name: migrations apply cleanly (upgrade → downgrade → upgrade) on Postgres
        env: {DATABASE_URL: "postgresql+psycopg://marketedge:marketedge@localhost:5432/marketedge"}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: tests (includes parallel == serial on Linux fork)
        run: python -m pytest -q
      - name: bandit
        run: bandit -q -r app engine
      - name: pip-audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: npm audit (production dependencies — fails the build)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (build/dev tools — report only; not shipped to the site)
        run: npm audit --audit-level=high || echo "::warning::dev-tool advisories found (Tailwind/ESLint build chain); they do not reach the deployed site"
