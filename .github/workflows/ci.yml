name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: marketedge, POSTGRES_PASSWORD: marketedge, POSTGRES_DB: marketedge}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U marketedge" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt bandit pip-audit
      - name: lint
        run: ruff check app engine tests
      - name: migrations apply cleanly (upgrade → downgrade → upgrade) on Postgres
        env: {DATABASE_URL: "postgresql+psycopg://marketedge:marketedge@localhost:5432/marketedge"}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: tests (includes parallel == serial on Linux fork)
        run: python -m pytest -q
      - name: bandit
        run: bandit -q -r app engine
      - name: pip-audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize render
        run: kubectl kustomize deploy/k8s/overlays/production > /dev/null
      - name: compose files
        run: |
          cp .env.example .env
          docker compose config -q
          mkdir -p secrets && touch secrets/secret_key secrets/encryption_key secrets/postgres_password secrets/metrics_token
          DOMAIN=ci.example.com ACME_EMAIL=ci@example.com MARKET_DATA_PROVIDER=csv docker compose -f docker-compose.prod.yml config -q

  images:
    needs: [backend, frontend, manifests]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: build api image (loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: marketedge-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: scan api image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: marketedge-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: push api image (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/marketedge-api:${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: build frontend image (loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: API_URL=http://api:8000
          load: true
          tags: marketedge-frontend:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: marketedge-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: push frontend image (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: API_URL=http://api:8000
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/marketedge-frontend:${{ github.sha }}
          cache-from: type=gha,scope=web
