groups:
  - name: marketedge
    rules:
      - alert: MarketEdgeApiDown
        expr: up{job="marketedge-api"} == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "MarketEdge API not scrapeable for 5m"}
      - alert: MarketEdgeHigh5xxRate
        expr: sum(rate(marketedge_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(marketedge_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: {severity: warning}
        annotations: {summary: ">2% of API requests failing with 5xx"}
      - alert: MarketEdgeSlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(marketedge_http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "API p95 latency above 1.5s"}
      - alert: MarketEdgeScanFailed
        expr: marketedge_scan_last_failed == 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Latest {{ $labels.market }} scan failed"}
      - alert: MarketEdgeScanStale
        # daily scans; 30h allows for weekends only on 24x7 markets — weekday markets use the lag alert below
        expr: marketedge_scan_age_hours{market="CRYPTO"} > 30
        labels: {severity: warning}
        annotations: {summary: "No successful {{ $labels.market }} scan for 30h"}
      - alert: MarketEdgeDataLag
        expr: marketedge_data_lag_days > 3
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.market }} data is {{ $value }} days behind the expected session (DATA DELAYED shown to users)"}
      - alert: MarketEdgeJobsFailing
        expr: sum by (kind) (marketedge_jobs_24h{status="failed"}) >= 3
        labels: {severity: warning}
        annotations: {summary: "{{ $value }} failed {{ $labels.kind }} jobs in 24h"}
      - alert: MarketEdgeNotificationFailures
        expr: sum by (channel) (marketedge_notification_deliveries_24h{status="failed"}) > 10
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.channel }} notification deliveries failing"}
      - alert: MarketEdgeQueueBacklog
        expr: marketedge_queue_depth{queue=~"default|notifications"} > 50 or marketedge_queue_depth{queue=~"scans|backtests"} > 20
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "{{ $value }} messages waiting on the {{ $labels.queue }} queue — is its worker running?"}
