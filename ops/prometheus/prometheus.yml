# Scrape config for MarketEdge AI. /metrics needs the bearer token (METRICS_TOKEN).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: marketedge-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]           # Kubernetes: replace with kubernetes_sd_configs (role: endpoints)
