# MarketEdge AI (lite) — local development. Production runs on Vercel + Neon + GitHub Actions (docs/DEPLOYMENT.md).
#   cp .env.example .env && docker compose up --build
# Jobs run inline from Admin → Jobs (JOB_RUNNER=inline); there are no background workers.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketedge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketedge}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  JOB_RUNNER: ${JOB_RUNNER:-inline}
  MARKETS_ENABLED: ${MARKETS_ENABLED:-NSE,CRYPTO}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-sample}
  OPTIONS_DATA_PROVIDER: ${OPTIONS_DATA_PROVIDER:-sample}
  CRYPTO_DATA_PROVIDER: ${CRYPTO_DATA_PROVIDER:-sample}
  BENCHMARK_SYMBOL: ${BENCHMARK_SYMBOL:-DEMO_NIFTY50}
  VIX_SYMBOL: ${VIX_SYMBOL:-DEMO_INDIAVIX}
  OPTIONS_UNDERLYING: ${OPTIONS_UNDERLYING:-DEMO_NIFTY50}
  OPTIONS_DISPLAY_NAME: ${OPTIONS_DISPLAY_NAME:-DEMO NIFTY}
  BENCHMARK_CRYPTO: ${BENCHMARK_CRYPTO:-DEMO_BTC}
  UPSTOX_UNIVERSE_SIZE: ${UPSTOX_UNIVERSE_SIZE:-300}
  UPSTOX_HISTORY_DAYS: ${UPSTOX_HISTORY_DAYS:-1460}
  UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-http://localhost:3000/api/v1/upstox/callback}
  BINANCE_UNIVERSE_SIZE: ${BINANCE_UNIVERSE_SIZE:-40}
  BINANCE_EXCLUDE: ${BINANCE_EXCLUDE:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  DEFAULT_MARKET: ${DEFAULT_MARKET:-}
  SCAN_WORKERS: ${SCAN_WORKERS:-2}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_FROM: ${SMTP_FROM:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketedge}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketedge}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: {context: ./backend, args: {DEV_TOOLS: "true"}}
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000   # Next.js rewrites are fixed at build time
    environment:
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
