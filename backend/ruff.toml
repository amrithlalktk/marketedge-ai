target-version = "py311"
line-length = 150
extend-exclude = ["alembic/versions"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "S110", "DTZ003"]
ignore = [
  "B008",  # FastAPI Depends()/Query() defaults
  "E731",  # small lambdas are used for readability in tests
  "B905",  # zip() without strict= (lengths are equal by construction)
  "E741",  # `l` = bar low in OHLC code
]
