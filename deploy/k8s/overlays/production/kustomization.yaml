# Example production overlay — set your registry, image tags (CI uses the git SHA), hostname.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - {name: marketedge-api, newName: ghcr.io/your-org/marketedge-api, newTag: "0.8.0"}
  - {name: marketedge-frontend, newName: ghcr.io/your-org/marketedge-frontend, newTag: "0.8.0"}
patches:
  - target: {kind: Ingress, name: marketedge}
    patch: |-
      - {op: replace, path: /spec/tls/0/hosts/0, value: marketedge.your-domain.com}
      - {op: replace, path: /spec/rules/0/host, value: marketedge.your-domain.com}
  - target: {kind: ConfigMap, name: marketedge-config}
    patch: |-
      - {op: replace, path: /data/CORS_ORIGINS, value: https://marketedge.your-domain.com}
      - {op: replace, path: /data/PUBLIC_APP_URL, value: https://marketedge.your-domain.com}
