# TLS via cert-manager (ClusterIssuer `letsencrypt` must exist). Ingress-nginx annotations shown;
# for AWS ALB / Azure App Gateway see docs/DEPLOYMENT.md.
# Only the frontend is public: it proxies /api/v1/* to the API, so the API Service stays internal
# and /metrics is never reachable from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketedge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [marketedge.example.com]
      secretName: marketedge-tls
  rules:
    - host: marketedge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {name: http}}}
