# Exactly ONE scheduler: two beats would enqueue every scheduled job twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels: {app.kubernetes.io/name: beat}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: beat}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: beat, marketedge/db-client: "true"}
    spec:
      serviceAccountName: marketedge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: beat
          image: marketedge-api
          command: ["celery", "-A", "app.workers.celery_app.celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: {name: marketedge-config}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: marketedge-secrets, defaultMode: 0400}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
