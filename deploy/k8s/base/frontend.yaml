apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: frontend}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend}
    spec:
      serviceAccountName: marketedge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: marketedge-frontend   # built with --build-arg API_URL=http://api:8000
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /login, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /login, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: next-cache, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: frontend}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
