# Run before rolling out a new image (CI does: delete old job → apply → wait for completion).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations: {argocd.argoproj.io/hook: PreSync}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrate, marketedge/db-client: "true"}
    spec:
      restartPolicy: Never
      serviceAccountName: marketedge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: marketedge-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: marketedge-config}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: marketedge-secrets, defaultMode: 0400}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
