# Non-secret settings. Secrets live in the `marketedge-secrets` Secret (see secrets.example.yaml),
# mounted as files and read through the *_FILE convention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketedge-config
data:
  ENVIRONMENT: production
  COOKIE_SECURE: "true"
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: https://marketedge.example.com
  PUBLIC_APP_URL: https://marketedge.example.com
  MARKETS_ENABLED: NSE,CRYPTO,US,EUROPE,ASIA,FX
  # Production refuses sample (DEMO_) providers unless ALLOW_SAMPLE_IN_PRODUCTION=true.
  MARKET_DATA_PROVIDER: csv
  OPTIONS_DATA_PROVIDER: csv
  CRYPTO_DATA_PROVIDER: binance
  GLOBAL_DATA_PROVIDER: twelvedata
  FX_DATA_PROVIDER: twelvedata
  NEWS_PROVIDER: finnhub
  CALENDAR_PROVIDER: finnhub
  CSV_DATA_DIR: /data/csv
  ANALYST_MODEL: claude-opus-5-5
  ANALYST_EFFORT: medium
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  # secrets via files (Secret volume mounted at /run/secrets)
  DATABASE_URL_FILE: /run/secrets/DATABASE_URL
  SECRET_KEY_FILE: /run/secrets/SECRET_KEY
  ENCRYPTION_KEY_FILE: /run/secrets/ENCRYPTION_KEY
  METRICS_TOKEN_FILE: /run/secrets/METRICS_TOKEN
