# NOT part of the kustomization — never commit real values. Create the Secret out of band, e.g.
#   kubectl -n marketedge create secret generic marketedge-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://marketedge:...@db-host:5432/marketedge?sslmode=require' \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" \
#     --from-literal=METRICS_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=PGPASSWORD='...'
# or sync it from your cloud secret manager (External Secrets Operator / CSI Secrets Store:
# AWS Secrets Manager, Azure Key Vault, GCP Secret Manager). Provider API keys (Twelve Data,
# Finnhub, Anthropic, SMTP, Telegram…) are best entered in Admin → Providers, where they are
# stored encrypted with ENCRYPTION_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: marketedge-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://marketedge:CHANGE_ME@postgres.example.internal:5432/marketedge?sslmode=require
  SECRET_KEY: CHANGE_ME_64_HEX
  ENCRYPTION_KEY: CHANGE_ME_FERNET_KEY
  METRICS_TOKEN: CHANGE_ME
  PGPASSWORD: CHANGE_ME
