# One Deployment per Celery queue. scans/backtests use the solo pool so each task can fork
# SCAN_WORKERS per-symbol processes (keep SCAN_WORKERS <= the CPU request).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app.kubernetes.io/name: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker, marketedge/db-client: "true"}
    spec:
      serviceAccountName: marketedge
      terminationGracePeriodSeconds: 60   # let a running task finish (acks_late redelivers otherwise)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: marketedge-api
          command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-Q", "default,notifications", "-n", "worker@%h", "--loglevel=INFO", "--concurrency=2"]
          env:
            - {name: SCAN_WORKERS, value: "1"}
          envFrom:
            - configMapRef: {name: marketedge-config}
          resources:
            requests: {cpu: "250m", memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: marketdata, mountPath: /data/csv}
      volumes:
        - name: secrets
          secret: {secretName: marketedge-secrets, defaultMode: 0400}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: marketdata
          persistentVolumeClaim: {claimName: marketdata}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scans
  labels: {app.kubernetes.io/name: worker-scans}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: worker-scans}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker-scans, marketedge/db-client: "true"}
    spec:
      serviceAccountName: marketedge
      terminationGracePeriodSeconds: 600   # let a running task finish (acks_late redelivers otherwise)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: marketedge-api
          command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-Q", "scans", "-n", "worker-scans@%h", "--loglevel=INFO", "--pool=solo"]
          env:
            - {name: SCAN_WORKERS, value: "4"}
          envFrom:
            - configMapRef: {name: marketedge-config}
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: marketdata, mountPath: /data/csv}
      volumes:
        - name: secrets
          secret: {secretName: marketedge-secrets, defaultMode: 0400}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: marketdata
          persistentVolumeClaim: {claimName: marketdata}
---
