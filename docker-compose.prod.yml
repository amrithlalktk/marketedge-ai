# Single-host production stack: Caddy terminates TLS (automatic Let's Encrypt) and is the ONLY
# published port (80 for the ACME challenge/redirect, 443). API, DB and Redis stay on the
# internal network; /metrics is not routed publicly.
#   cp .env.example .env   # ENVIRONMENT=production, DOMAIN, ACME_EMAIL, strong secrets
#   mkdir -p secrets && openssl rand -hex 32 > secrets/secret_key ...   (see docs/DEPLOYMENT.md)
#   docker compose -f docker-compose.prod.yml up -d --build
x-backend: &backend
  build: ./backend
  image: marketedge-api:${IMAGE_TAG:-local}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=512m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [data, edge]   # data: postgres/redis; edge: outbound HTTPS to licensed providers
  volumes: [marketdata:/data/csv]
  secrets: [secret_key, encryption_key, postgres_password, metrics_token]
  environment: &backend-env
    ENVIRONMENT: production
    COOKIE_SECURE: "true"
    LOG_FORMAT: json
    DATABASE_URL: postgresql+psycopg://marketedge@postgres:5432/marketedge   # password via PGPASSWORD below
    PGPASSFILE: /tmp/.pgpass
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY_FILE: /run/secrets/secret_key
    ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    METRICS_TOKEN_FILE: /run/secrets/metrics_token
    CORS_ORIGINS: https://${DOMAIN:?set DOMAIN}
    PUBLIC_APP_URL: https://${DOMAIN}
    MARKETS_ENABLED: ${MARKETS_ENABLED:-NSE,CRYPTO,US,EUROPE,ASIA,FX}
    MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:?set a licensed provider}
    OPTIONS_DATA_PROVIDER: ${OPTIONS_DATA_PROVIDER:-csv}
    CRYPTO_DATA_PROVIDER: ${CRYPTO_DATA_PROVIDER:-binance}
    GLOBAL_DATA_PROVIDER: ${GLOBAL_DATA_PROVIDER:-twelvedata}
    FX_DATA_PROVIDER: ${FX_DATA_PROVIDER:-twelvedata}
    NEWS_PROVIDER: ${NEWS_PROVIDER:-finnhub}
    CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-finnhub}
    ALLOW_SAMPLE_IN_PRODUCTION: ${ALLOW_SAMPLE_IN_PRODUCTION:-false}
    CSV_DATA_DIR: /data/csv
    SENTRY_DSN: ${SENTRY_DSN:-}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  # libpq reads the password from PGPASSFILE; written at start from the Docker secret
  entrypoint: ["sh", "-c", "printf 'postgres:5432:marketedge:marketedge:%s\\n' \"$$(cat /run/secrets/postgres_password)\" > /tmp/.pgpass && chmod 600 /tmp/.pgpass && exec \"$$@\"", "--"]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [frontend]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketedge
      POSTGRES_DB: marketedge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U marketedge"], interval: 5s, retries: 20}
    shm_size: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]
    read_only: true
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}

  api:
    <<: *backend
    command: ["/app/scripts/start-api.sh"]
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-Q", "default,notifications", "-n", "default@%h", "--loglevel=INFO", "--concurrency=2"]
    healthcheck: {disable: true}
    depends_on: [api]

  worker-scans:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-Q", "scans", "-n", "scans@%h", "--pool=solo", "--loglevel=INFO"]
    environment: {<<: *backend-env, SCAN_WORKERS: "${SCAN_WORKERS:-4}"}
    healthcheck: {disable: true}
    depends_on: [api]

  worker-backtests:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-Q", "backtests", "-n", "backtests@%h", "--pool=solo", "--loglevel=INFO"]
    environment: {<<: *backend-env, SCAN_WORKERS: "${BACKTEST_WORKERS:-4}"}
    healthcheck: {disable: true}
    depends_on: [api]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app.celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck: {disable: true}
    depends_on: [api]

  frontend:
    build: {context: ./frontend, args: {API_URL: "http://api:8000"}}
    image: marketedge-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m", "/app/.next/cache:size=256m,uid=1001"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [data]
    secrets: [postgres_password]
    environment:
      PGHOST: postgres
      PGUSER: marketedge
      PGDATABASE: marketedge
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["./ops/backup/backup.sh:/backup.sh:ro", "${BACKUP_DIR:-./backups}:/backups"]
    # 21:30 UTC daily (03:00 IST). Replace with host cron / a cloud scheduler if preferred.
    entrypoint: ["sh", "-c", "echo '30 21 * * * /bin/sh /backup.sh' | crontab - && exec crond -f -l 8"]
    depends_on:
      postgres: {condition: service_healthy}

secrets:
  secret_key: {file: ./secrets/secret_key}
  encryption_key: {file: ./secrets/encryption_key}
  postgres_password: {file: ./secrets/postgres_password}
  metrics_token: {file: ./secrets/metrics_token}

networks:
  data: {internal: true}   # postgres + redis: no route in or out of the host
  edge: {}                 # caddy, frontend, api, workers (egress); nothing published except caddy

volumes:
  pgdata:
  marketdata:
  caddy_data:
  caddy_config:
